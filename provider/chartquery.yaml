identity:
  author: chartquery
  name: chartquery
  label:
    en_US: ChartQuery
  description:
    en_US: 'Charts, diagrams, QR codes and barcodes from ChartQuery: Chart.js charts from a config or a plain-words prompt, Mermaid, D2, PlantUML and Graphviz diagrams, styled QR codes and barcodes, returned as images with shareable links.'
  icon: icon.svg
  tags:
  - design
  - image
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API Key
    placeholder:
      en_US: Enter your ChartQuery API key
    help:
      en_US: Get an API key in the ChartQuery dashboard.
    url: https://app.chartquery.com
tools:
- tools/create_chart.yaml
- tools/chart_from_prompt.yaml
- tools/create_diagram.yaml
- tools/diagram_from_prompt.yaml
- tools/qr_code.yaml
- tools/barcode.yaml
extra:
  python:
    source: provider/chartquery.py
